<script>
// Aguarda a página HTML carregar completamente antes de rodar o script
document.addEventListener('DOMContentLoaded', function() {
    
    document.getElementById('form-github-alerta').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('btn-salvar');
        const status = document.getElementById('mensagem-status');
        
        const senhaDigitada = document.getElementById('senha-admin').value;
        const githubToken = document.getElementById('token-github').value.trim();
        const novaClasse = document.getElementById('tipo-alerta').value;
        const novoTexto = document.getElementById('novo-texto-alerta').value;

        const SENHA_CORRETA = "4321"; 
        const USERNAME = "daniko1503"; 
        const REPO = "si-sindicato"; 
        const FILE_PATH = "index.html";

        if (senhaDigitada !== SENHA_CORRETA) {
            status.style.color = "red";
            status.innerText = "❌ Senha do painel incorreta!";
            return;
        }
        
        btn.disabled = true;
        status.style.color = "blue";
        status.innerText = "Conectando ao GitHub...";

        try {
            const url = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${FILE_PATH}`;
            
            const response = await fetch(url, {
                headers: { 
                    "Authorization": `Bearer ${githubToken}`,
                    "Accept": "application/vnd.github.v3+json"
                }
            });
            
            if (!response.ok) throw new Error("Token inválido ou sem permissão de acesso.");
            
            const fileData = await response.json();
            const rawContent = decodeURIComponent(escape(atob(fileData.content)));
            
            let rotulo = "URGENTE";
            if (novaClasse === "alerta-informativo") rotulo = "INFORMAÇÃO";
            if (novaClasse === "alerta-sucesso") rotulo = "AVISO";

            const novoBlocoAlerta = `<!-- PAINEL DE AVISOS URGENTES -->\n<div class="${novaClasse}" id="painel-alerta">\n    <div class="container alerta-content">\n        <span class="badge-alerta">${rotulo}</span>\n        <p>${novoTexto}</p>\n    </div>\n</div>`;
                                  
            const regexPainelCompleto = /<!-- PAINEL DE AVISOS URGENTES -->[\s\(\S\)]*?<div[^>]*id="painel-alerta"[\s\(\S\)]*?<\/div>\s*<\/div>/;
            
            if (!regexPainelCompleto.test(rawContent)) {
                throw new Error("Não localizamos o comentário e a estrutura 'painel-alerta' no index.html.");
            }
            
            const conteudoModificado = rawContent.replace(regexPainelCompleto, novoBlocoAlerta);

            const updateResponse = await fetch(url, {
                method: "PUT",
                headers: {
                    "Authorization": `Bearer ${githubToken}`,
                    "Content-Type": "application/json",
                    "Accept": "application/vnd.github.v3+json"
                },
                body: JSON.stringify({
                    message: "🚨 Alerta atualizado via Painel Admin",
                    content: btoa(unescape(encodeURIComponent(conteudoModificado))),
                    sha: fileData.sha
                })
            });

            if (updateResponse.ok) {
                status.style.color = "green";
                status.innerText = "✅ Publicado com sucesso! O site foi alterado no GitHub Pages. Aguarde 1 minuto para atualizar.";
                document.getElementById('novo-texto-alerta').value = '';
            } else {
                throw new Error("Erro ao salvar atualizações no repositório.");
            }

        } catch (error) {
            status.style.color = "red";
            status.innerText = "❌ Erro: " + error.message;
        } finally {
            btn.disabled = false;
        }
    });

}); // Fim do DOMContentLoaded
</script>
